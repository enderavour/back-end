<!doctype html>
<html>
    <head>
        <title>CORS test</title>
    </head>
    <body>
        <script>
            fetch("http://127.0.0.1:8000/", {
                method: "GET",
            })
                .then((res) => res.json())
                .then((data) => console.log(data))
                .catch((err) => console.error(err));
        </script>
    </body>
</html>
